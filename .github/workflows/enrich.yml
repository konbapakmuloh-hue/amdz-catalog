name: AniList Auto-Enrich

on:
  push:
    paths:
      - 'catalog.json'
      - 'catalog_*.json'
  schedule:
    - cron: '17 1 * * *'   # tiap hari 08:17 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Jalankan enricher
        run: python3 enrich.py catalog.json

      - name: Commit & push hasil
        if: always()
        run: |
          if [ -f catalog_enriched.json ]; then
            mv catalog_enriched.json catalog.json
          fi
          git config user.name "amdz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json enrich_progress.json report_unmatched.json 2>/dev/null || true
          git diff --staged --quiet && echo "Tidak ada perubahan, skip commit" && exit 0
          git commit -m "chore: auto-enrich tahun/genre dari AniList [skip ci]"
          git push