name: Scrape Anime Catalog

on:
  schedule:
    - cron: '0 */6 * * *'   # tiap 6 jam (UTC)
  workflow_dispatch:        # bisa jalan manual dari tab Actions

concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan scraper
        run: node scraper.js

      - name: Commit & push hasil
        run: |
          git config user.name "amdz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json meta.json
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "chore: update catalog"
          git push
